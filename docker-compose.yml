services:
  tests-dev:
    build:
      context: .
      dockerfile: Dockerfile
    ipc: host
    init: true
    env_file: .env.dev
    command: >
      sh -c "npx playwright test; code=$$?;
             npx allure generate allure-results --clean -o allure-report;
             exit $$code"
    volumes:
      - ./allure-results-dev:/app/allure-results
      - ./allure-report-dev:/app/allure-report
      - ./verification:/app/verification
 
  tests-qa:
    build:
      context: .
      dockerfile: Dockerfile
    ipc: host
    init: true
    env_file: .env.qa
    command: >
      sh -c "npx playwright test; code=$$?;
             npx allure generate allure-results --clean -o allure-report;
             exit $$code"
    volumes:
      - ./allure-results-qa:/app/allure-results
      - ./allure-report-qa:/app/allure-report
      - ./verification:/app/verification